<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Пульт | Projector Visualizer</title>
  <style>
    :root {
      --bg: #0b0c10;
      --card-bg: rgba(255, 255, 255, 0.06);
      --card-active: rgba(0, 243, 255, 0.2);
      --accent: #00f3ff;
      --accent-pink: #ff007f;
      --text: #ffffff;
      --text-muted: #8892b0;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      padding: 20px 16px;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-bottom: 12px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
    }

    h1 {
      font-size: 1.25rem;
      font-weight: 700;
      background: linear-gradient(135deg, var(--accent), var(--accent-pink));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .beat-indicator {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 0.8rem;
      color: var(--text-muted);
    }

    .beat-dot {
      width: 14px;
      height: 14px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.2);
      transition: all 0.08s ease-out;
    }

    .beat-dot.flash {
      background: var(--accent);
      box-shadow: 0 0 16px var(--accent);
      transform: scale(1.35);
    }

    .section-title {
      font-size: 0.85rem;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: var(--text-muted);
      margin-bottom: 10px;
    }

    /* Grid of Presets */
    .preset-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 12px;
    }

    .preset-card {
      background: var(--card-bg);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 16px;
      padding: 18px 14px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .preset-card:active {
      transform: scale(0.96);
    }

    .preset-card.active {
      background: var(--card-active);
      border-color: var(--accent);
      box-shadow: 0 0 20px rgba(0, 243, 255, 0.25);
    }

    .preset-icon {
      font-size: 1.8rem;
    }

    .preset-name {
      font-size: 0.95rem;
      font-weight: 600;
    }

    /* Palettes Grid */
    .palette-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
    }

    .palette-btn {
      background: var(--card-bg);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 12px;
      padding: 12px 8px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
      cursor: pointer;
    }

    .palette-btn.active {
      border-color: #fff;
      box-shadow: 0 0 12px rgba(255, 255, 255, 0.3);
    }

    .color-swatches {
      display: flex;
      gap: 4px;
    }

    .swatch {
      width: 12px;
      height: 12px;
      border-radius: 50%;
    }

    .palette-label {
      font-size: 0.75rem;
      color: #ddd;
    }

    /* Sliders & Controls */
    .control-box {
      background: var(--card-bg);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 16px;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .slider-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.9rem;
    }

    input[type=range] {
      width: 100%;
      height: 8px;
      border-radius: 4px;
      background: rgba(255, 255, 255, 0.2);
      outline: none;
      -webkit-appearance: none;
    }

    input[type=range]::-webkit-slider-thumb {
      -webkit-appearance: none;
      width: 22px;
      height: 22px;
      border-radius: 50%;
      background: var(--accent);
      box-shadow: 0 0 10px var(--accent);
    }

    .toggle-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.95rem;
      padding: 8px 0;
    }

    .switch {
      position: relative;
      display: inline-block;
      width: 50px;
      height: 28px;
    }

    .switch input {
      opacity: 0;
      width: 0;
      height: 0;
    }

    .slider-round {
      position: absolute;
      cursor: pointer;
      top: 0; left: 0; right: 0; bottom: 0;
      background-color: rgba(255, 255, 255, 0.2);
      transition: .3s;
      border-radius: 28px;
    }

    .slider-round:before {
      position: absolute;
      content: "";
      height: 20px;
      width: 20px;
      left: 4px;
      bottom: 4px;
      background-color: white;
      transition: .3s;
      border-radius: 50%;
    }

    input:checked + .slider-round {
      background-color: var(--accent);
    }

    input:checked + .slider-round:before {
      transform: translateX(22px);
    }
  </style>
</head>
<body>

  <header>
    <h1>📽️ Пульт Проектора</h1>
    <div class="beat-indicator">
      <span>БИТ:</span>
      <div id="beat-dot" class="beat-dot"></div>
    </div>
  </header>

  <!-- Visualizer Presets -->
  <div>
    <div class="section-title">Визуальные Режимы</div>
    <div class="preset-grid">
      <div class="preset-card active" data-preset="0">
        <span class="preset-icon">🧪</span>
        <span class="preset-name">Кислотный шейдер</span>
      </div>
      <div class="preset-card" data-preset="1">
        <span class="preset-icon">⭕</span>
        <span class="preset-name">Неоновое кольцо</span>
      </div>
      <div class="preset-card" data-preset="2">
        <span class="preset-icon">🌆</span>
        <span class="preset-name">Ретровейв 80-х</span>
      </div>
      <div class="preset-card" data-preset="3">
        <span class="preset-icon">🌌</span>
        <span class="preset-name">Гиперпространство</span>
      </div>
      <div class="preset-card" data-preset="4" style="grid-column: span 2;">
        <span class="preset-icon">📊</span>
        <span class="preset-name">3D Эквалайзер и Зеркало</span>
      </div>
    </div>
  </div>

  <!-- Color Palettes -->
  <div>
    <div class="section-title">Цветовая Палитра</div>
    <div class="palette-grid">
      <div class="palette-btn active" data-palette="cyberpunk">
        <div class="color-swatches">
          <div class="swatch" style="background: #00f3ff;"></div>
          <div class="swatch" style="background: #ff007f;"></div>
        </div>
        <span class="palette-label">Киберпанк</span>
      </div>

      <div class="palette-btn" data-palette="sunset">
        <div class="color-swatches">
          <div class="swatch" style="background: #ff3b00;"></div>
          <div class="swatch" style="background: #ff0078;"></div>
        </div>
        <span class="palette-label">Закат</span>
      </div>

      <div class="palette-btn" data-palette="matrix">
        <div class="color-swatches">
          <div class="swatch" style="background: #00ff88;"></div>
          <div class="swatch" style="background: #39ff14;"></div>
        </div>
        <span class="palette-label">Матрица</span>
      </div>

      <div class="palette-btn" data-palette="acid">
        <div class="color-swatches">
          <div class="swatch" style="background: #ff0055;"></div>
          <div class="swatch" style="background: #ffee00;"></div>
        </div>
        <span class="palette-label">Психоделика</span>
      </div>

      <div class="palette-btn" data-palette="ice">
        <div class="color-swatches">
          <div class="swatch" style="background: #00d4ff;"></div>
          <div class="swatch" style="background: #a0e7e5;"></div>
        </div>
        <span class="palette-label">Аврора</span>
      </div>

      <div class="palette-btn" data-palette="fire">
        <div class="color-swatches">
          <div class="swatch" style="background: #ffd000;"></div>
          <div class="swatch" style="background: #ff1e00;"></div>
        </div>
        <span class="palette-label">Пламя</span>
      </div>
    </div>
  </div>

  <!-- Settings Box -->
  <div class="control-box">
    <div class="slider-row">
      <span>Чувствительность к музыке:</span>
      <span id="gain-val">1.0x</span>
    </div>
    <input type="range" id="remote-gain" min="0.2" max="3.0" step="0.1" value="1.0">

    <div class="toggle-row">
      <span>Строб-вспышка на бит</span>
      <label class="switch">
        <input type="checkbox" id="remote-strobe" checked>
        <span class="slider-round"></span>
      </label>
    </div>
  </div>

  <script>
    const protocol = location.protocol === 'https:' ? 'wss:' : 'ws:';
    const ws = new WebSocket(`${protocol}//${location.host}/ws`);
    const beatDot = document.getElementById('beat-dot');
    const gainSlider = document.getElementById('remote-gain');
    const gainVal = document.getElementById('gain-val');
    const strobeToggle = document.getElementById('remote-strobe');

    ws.onmessage = (event) => {
      try {
        const data = JSON.parse(event.data);
        if (data.type === 'audio') {
          if (data.beat) {
            beatDot.classList.add('flash');
            setTimeout(() => beatDot.classList.remove('flash'), 80);
          }
        } else if (data.type === 'state') {
          updateUI(data.preset, data.palette, data.gain, data.strobe);
        } else if (data.type === 'set_preset') {
          highlightPreset(data.preset);
        } else if (data.type === 'set_palette') {
          highlightPalette(data.palette);
        }
      } catch (e) {}
    };

    function updateUI(preset, palette, gain, strobe) {
      if (typeof preset === 'number') highlightPreset(preset);
      if (palette) highlightPalette(palette);
      if (typeof gain === 'number') {
        gainSlider.value = gain;
        gainVal.textContent = gain.toFixed(1) + 'x';
      }
      if (typeof strobe === 'boolean') {
        strobeToggle.checked = strobe;
      }
    }

    function highlightPreset(idx) {
      document.querySelectorAll('.preset-card').forEach(c => {
        c.classList.toggle('active', parseInt(c.dataset.preset) === idx);
      });
    }

    function highlightPalette(pal) {
      document.querySelectorAll('.palette-btn').forEach(b => {
        b.classList.toggle('active', b.dataset.palette === pal);
      });
    }

    // Interactions
    document.querySelectorAll('.preset-card').forEach(card => {
      card.addEventListener('click', () => {
        const p = parseInt(card.dataset.preset);
        highlightPreset(p);
        ws.send(JSON.stringify({ type: 'set_preset', preset: p }));
      });
    });

    document.querySelectorAll('.palette-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        const pal = btn.dataset.palette;
        highlightPalette(pal);
        ws.send(JSON.stringify({ type: 'set_palette', palette: pal }));
      });
    });

    gainSlider.addEventListener('input', (e) => {
      const val = parseFloat(e.target.value);
      gainVal.textContent = val.toFixed(1) + 'x';
      ws.send(JSON.stringify({ type: 'set_gain', gain: val }));
    });

    strobeToggle.addEventListener('change', (e) => {
      ws.send(JSON.stringify({ type: 'set_strobe', strobe: e.target.checked }));
    });
  </script>
</body>
</html>
